sonar.projectKey=Youchenjiang_ctfd-kit
sonar.organization=youchenjiang

# Source configuration
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions from general analysis (database dumps, reverse challenge binaries, static assets)
sonar.exclusions=ctfd/database/**,ctfd/challenges/**,ctfd/plugins/**/assets/**,**/*.sql,**/*.exe,**/*.obj,**/*.pdb,**/*.patch

# Duplication detector (CPD) exclusions
# Reverse challenge game logic, SQL dumps, and plugin assets must not be treated as duplicate business logic
sonar.cpd.exclusions=ctfd/challenges/**,ctfd/database/**,ctfd/plugins/**,**/*.sql,**/*.c,**/*.h,**/*.md
