sonar.projectKey=Youchenjiang_ctfd-kit
sonar.organization=youchenjiang
sonar.sources=.
sonar.sourceEncoding=UTF-8

# SonarCloud Automatic Analysis Configuration
# Global exclusions
sonar.exclusions=ctfd/database/**,ctfd/challenges/**,ctfd/automation/**,ctfd/assets/**,ctfd/plugins/**/assets/**,**/*.sql,**/*.exe,**/*.obj,**/*.pdb,**/*.patch

# Duplication detection (CPD) exclusions
sonar.cpd.exclusions=ctfd/challenges/**,ctfd/database/**,ctfd/plugins/**,ctfd/automation/**,ctfd/assets/**,**/*.sql,**/*.c,**/*.h,**/*.md

# Intentional vulnerability suppression for CTF lab challenge files
# These files are deliberately insecure for educational purposes in isolated Docker environments
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S4502
sonar.issue.ignore.multicriteria.e1.resourceKey=security/labs/03_apt_cross_domain_ctf/**
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S4721
sonar.issue.ignore.multicriteria.e2.resourceKey=security/labs/03_apt_cross_domain_ctf/**
sonar.issue.ignore.multicriteria.e3.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e3.resourceKey=security/labs/03_apt_cross_domain_ctf/**
sonar.issue.ignore.multicriteria.e4.ruleKey=docker:S8*
sonar.issue.ignore.multicriteria.e4.resourceKey=security/labs/03_apt_cross_domain_ctf/**
